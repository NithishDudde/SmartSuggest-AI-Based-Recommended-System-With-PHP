<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>SmartSuggest - Register</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
    <link rel="stylesheet" href="style.css" />
</head>
<body>
    <header>
        <nav>
            <div class="logo">
                <i class="fas fa-film"></i>
                <span>SmartSuggest</span>
            </div>
</nav>
    </header>

    <div class="container">
        <div class="form-container">
            <div class="form-header">
                <h2>Create Account</h2>
                <p>Join us to get personalized movie recommendations</p>
            </div>

            <form id="register-form" method="post" action="register.php">
                <div class="form-group">
                    <label for="register-username">Username</label>
                    <input type="text" name="uname" id="register-username" required placeholder="Choose a username" autocomplete="username" />
                    <i class="fas fa-user input-icon"></i>
                </div>
                <div class="form-group">
                    <label for="register-email">Email</label>
                    <input type="email" name="email" id="register-email" required placeholder="Enter your email" autocomplete="email" />
                    <i class="fas fa-envelope input-icon"></i>
                </div>
                <div class="form-group">
                    <label for="register-password">Password</label>
                    <input type="password" name="pass" id="register-password" required placeholder="Create a password" autocomplete="new-password" />
                    <i class="fas fa-lock input-icon"></i>
                </div>
                <div class="form-group">
                    <label for="register-confirm">Confirm Password</label>
                    <input type="password" name="confp" id="register-confirm" required placeholder="Confirm your password" autocomplete="new-password" />
                    <i class="fas fa-lock input-icon"></i>
                </div>
                <button type="submit"><i class="fas fa-user-plus"></i> Register</button>
                <p style="margin-top: 20px; text-align: center;">
                    Already have an account? <a href="log.html" style="color: var(--secondary);">Login here</a>
                </p>
            </form>
        </div>
    </div>

    <script>
        document.getElementById('register-form').addEventListener('submit', function(e) {
            const password = document.getElementById('register-password').value;
            const confirm = document.getElementById('register-confirm').value;

            if (password !== confirm) {
                e.preventDefault();
                alert('Passwords do not match!');
            }
        });
    </script>
</body>
</html>
