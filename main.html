<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>SmartSuggest - Movie Recommendations</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <!-- Header -->
  <header>
    <nav>
      <div class="logo">
        <i class="fas fa-film"></i>
        <span>SmartSuggest</span>
      </div>
      <ul>
        <li><a href="main.html" class="active"><i class="fas fa-home"></i> Home</a></li>
        <li><a href="feedback.html"><i class="fas fa-comment"></i> Feedback</a></li>
        <li><a href="profile.php"><i class="fas fa-user"></i> Profile</a></li>
      </ul>
    </nav>
  </header>

  <!-- Main Content -->
  <div class="container">
    <div class="hero">
      <h1>Discover Your Next Favorite Movie</h1>
      <p>Smart recommendations that work even without viewing history</p>
      <div class="search-bar">
        <input type="text" id="search-input" placeholder="Enter a movie you like..." />
        <button onclick="getRecommendations()"><i class="fas fa-search"></i> Get Recommendations</button>
      </div>
    </div>

    <!-- Loader -->
    <div class="loader" id="loader" style="display:none;"></div>

    <!-- Recommendations -->
    <h2 id="recommendation-title">Recommended For You</h2>
    <div class="movies-grid" id="movies-container">
      <!-- Movies will be added here -->
    </div>
  </div>

  <!-- Movie Details Modal -->
  <div class="modal-overlay" id="movie-modal-overlay">
    <div class="modal" id="movie-modal">
      <button class="modal-close" onclick="closeModal()">&times;</button>
      <div class="modal-left" id="modal-poster"></div>
      <div class="modal-right">
        <h2 class="movie-modal-title" id="modal-title"></h2>
        <p class="movie-modal-tagline" id="modal-tagline"></p>
        <p class="movie-modal-overview" id="modal-overview"></p>

        <div class="movie-modal-details">
          <div class="detail-label">Genre:</div>
          <div class="detail-value" id="modal-genre"></div>
          <div class="detail-label">Director:</div>
          <div class="detail-value" id="modal-director"></div>
          <div class="detail-label">Cast:</div>
          <div class="detail-value" id="modal-cast"></div>
        </div>

        <div class="modal-actions">
          <button class="btn btn-ghost" onclick="closeModal()">Back</button>
          <button class="btn btn-primary" onclick="submitFeedback()">Give Feedback</button>
        </div>
      </div>
    </div>
  </div>

  <!-- JavaScript -->
  <script>
    // Fetch recommendations
    async function getRecommendations() {
      const movieTitle = document.getElementById('search-input').value.trim();
      if (!movieTitle) {
        alert('Please enter a movie title');
        return;
      }

      document.getElementById('loader').style.display = 'block';
      document.getElementById('recommendation-title').textContent =
        `Recommendations based on "${movieTitle}"`;

      try {
        const response = await fetch(`get_recommendations.php?movie=${encodeURIComponent(movieTitle)}`);
        if (!response.ok) throw new Error('Failed to fetch recommendations');
        const recommendations = await response.json();

        if (recommendations.error) throw new Error(recommendations.error);
        displayMovies(recommendations);
      } catch (error) {
        console.error('Error fetching recommendations:', error);
        displayDemoMovies();
      } finally {
        document.getElementById('loader').style.display = 'none';
      }
    }

    // Show movie cards
  function displayMovies(movies) {
  const container = document.getElementById('movies-container');
  container.innerHTML = '';

  if (!movies || movies.length === 0) {
    container.innerHTML =
      '<p style="text-align: center; color: white; grid-column: 1 / -1;">No recommendations found. Try a different movie.</p>';
    return;
  }

  movies.forEach(movie => {
    const movieCard = document.createElement('div');
    movieCard.className = 'movie-card';

    const genre = (movie.genre || '').split('|')[0];
    const director = (movie.director || '').split('|')[0];

    movieCard.innerHTML = `
      <div class="movie-poster" style="background-color: black; color: white; display: flex; align-items: center; justify-content: center; height: 300px; font-size: 1.2em;">
        ${movie.title}
      </div>
      <div class="movie-info">
        <h3 class="movie-title">${movie.title}</h3>
        <div class="movie-meta">
          <span>${genre}</span>
          <span>${director}</span>
        </div>
        <p class="movie-description">${movie.tagline || 'No description available'}</p>
        <button class="details-button"><i class="fas fa-ellipsis-h"></i> More Details</button>
      </div>
    `;

    // Attach event to the "More Details" button
    const infoDiv = movieCard.querySelector('.movie-info');
    const detailsButton = infoDiv.querySelector('.details-button');

    detailsButton.addEventListener('click', () => {
      fetchMovieDetails(movie.title, infoDiv);
    });

    container.appendChild(movieCard);
  });
}


    // Fetch full details for a movie
    async function fetchMovieDetails(title, parentElement) {
  try {
    const response = await fetch(`get_movie_details.php?title=${encodeURIComponent(title)}`);
    if (!response.ok) throw new Error('Failed to fetch movie details');
    const details = await response.json();

    if (details.error) throw new Error(details.error);

    openMovieModal(details, parentElement);
  } catch (error) {
    console.error('Error fetching movie details:', error);
    alert('Movie details not available.');
  }
}


    // Open modal and display details
   function openMovieModal(details, parentElement) {
  // Remove "More Details" button
  const button = parentElement.querySelector('.details-button');
  if (button) button.remove();

  const modalHTML = `
    <div class="inline-modal" style="margin-top: 10px; padding: 10px; background-color: #222; color: white; border-radius: 5px;">
      <p><strong>Tagline:</strong> ${details.Movie_Tagline || 'No tagline available.'}</p>
      <p><strong>Overview:</strong> ${details.Movie_Overview || 'No overview available.'}</p>
      <p><strong>Genre:</strong> ${details.Movie_Genre|| 'N/A'}</p>
      <p><strong>Director:</strong> ${details.Movie_Director || 'N/A'}</p>
      <p><strong>Cast:</strong> ${details.Movie_Cast || 'N/A'}</p>
      <button class="btn btn-ghost close-inline-modal" style="margin-top:10px;">Back</button>
    </div>
  `;

  const wrapper = document.createElement('div');
  wrapper.innerHTML = modalHTML;
  parentElement.appendChild(wrapper);

  // Handle Back button
  wrapper.querySelector('.close-inline-modal').addEventListener('click', () => {
    wrapper.remove();

    // Restore the More Details button
    const restoreBtn = document.createElement('button');
    restoreBtn.className = 'details-button';
    restoreBtn.innerHTML = `<i class="fas fa-ellipsis-h"></i> More Details`;

    restoreBtn.addEventListener('click', () => {
      fetchMovieDetails(details.Movie_Title, parentElement);
    });

    parentElement.appendChild(restoreBtn);
  });
}


    // ✅ Moved outside any function so it's globally accessible
    function closeModal() {
      document.getElementById('movie-modal-overlay').style.display = 'none';

      // Optional: Clear modal content
      document.getElementById('modal-title').textContent = '';
      document.getElementById('modal-tagline').textContent = '';
      document.getElementById('modal-overview').textContent = '';
      document.getElementById('modal-genre').textContent = '';
      document.getElementById('modal-director').textContent = '';
      document.getElementById('modal-cast').textContent = '';
      document.getElementById('modal-poster').innerHTML = '';
    }

    function submitFeedback() {
      alert('Thanks for your feedback! (This would connect to backend in real app)');
      closeModal();
    }

    // Demo movies if API fails
    function displayDemoMovies() {
      const demoMovies = [
        { title: "The Matrix", genre: "Action|Sci-Fi", director: "Wachowski", tagline: "Welcome to the Real World." },
        { title: "Inception", genre: "Action|Sci-Fi|Thriller", director: "Christopher Nolan", tagline: "Your mind is the scene of the crime." },
        { title: "The Dark Knight", genre: "Action|Crime|Drama", director: "Christopher Nolan", tagline: "Why So Serious?" },
        { title: "Interstellar", genre: "Adventure|Drama|Sci-Fi", director: "Christopher Nolan", tagline: "Mankind was born on Earth. It was never meant to die here." }
      ];
      displayMovies(demoMovies);
    }
  </script>
</body>
</html>
